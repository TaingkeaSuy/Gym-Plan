<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register — FitZone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar bg-white border-bottom px-4">
    <a class="navbar-brand fw-bold" href="/">FitZone</a>
</nav>

<div class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm" style="width:100%;max-width:400px">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-1">Create account</h4>
            <p class="text-muted small mb-4">Join FitZone today</p>

            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-medium">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Your name"
                           th:value="${name}" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-medium">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="you@email.com"
                           th:value="${email}" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-medium">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-medium">Confirm Password</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat password" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>

            <p class="text-center text-muted small mt-3 mb-0">
                Have an account? <a href="/login" class="text-primary fw-medium">Sign in</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
