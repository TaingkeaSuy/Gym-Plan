<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Patrick Star Gym – Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #0f0f0f; --grey-1: #404040; --grey-2: #888;
            --grey-3: #ccc; --grey-4: #f0f0f0; --white: #ffffff;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }
        nav { display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 60px; border-bottom: 1px solid var(--grey-4); }
        .logo { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--black); text-decoration: none; }
        .nav-back { font-size: 13px; color: var(--grey-2); text-decoration: none; transition: color .15s; }
        .nav-back:hover { color: var(--black); }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
        .card { width: 100%; max-width: 360px; animation: rise .4s ease both; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .card-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--grey-2); margin-bottom: 10px; }
        .card-title { font-family: 'DM Serif Display', serif; font-size: 32px; line-height: 1.1; color: var(--black); margin-bottom: 6px; }
        .card-sub { font-size: 13px; color: var(--grey-2); margin-bottom: 28px; }
        .alert { padding: 11px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; margin-bottom: 20px; border: 1px solid; }
        .alert-error   { background: #fff5f5; color: #c0392b; border-color: #f5c6c6; }
        .alert-success { background: #f5fff8; color: #1a7a3c; border-color: #b6e8c6; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12px; font-weight: 600; color: var(--grey-1); margin-bottom: 6px; letter-spacing: .03em; }
        .field input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--grey-3); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--black); background: var(--white); outline: none; transition: border-color .15s; }
        .field input:focus { border-color: var(--black); }
        .field input::placeholder { color: var(--grey-3); }
        .field-hint { font-size: 11px; color: var(--grey-2); margin-top: 5px; }
        .btn-submit { width: 100%; padding: 13px; background: var(--black); color: var(--white); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 6px; transition: opacity .15s; }
        .btn-submit:hover { opacity: .85; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .divider hr { flex: 1; border: none; border-top: 1px solid var(--grey-4); }
        .divider span { font-size: 12px; color: var(--grey-3); }
        .btn-secondary { display: block; width: 100%; padding: 13px; background: transparent; color: var(--black); border: 1.5px solid var(--grey-3); border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; text-align: center; text-decoration: none; transition: border-color .15s, background .15s; }
        .btn-secondary:hover { border-color: var(--black); background: var(--grey-4); }
        footer { text-align: center; padding: 20px; font-size: 12px; color: var(--grey-3); border-top: 1px solid var(--grey-4); }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/}" class="logo">Patrick Star Gym</a>
    <a th:href="@{/}" class="nav-back">← Home</a>
</nav>

<main>
    <div class="card">
        <div class="card-eyebrow">New member</div>
        <div class="card-title">Create account</div>
        <div class="card-sub">Free to join. Cancel anytime.</div>

        <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form method="post" th:action="@{/register}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="your_username" required autofocus/>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required/>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" minlength="6" required/>
                <div class="field-hint">At least 6 characters</div>
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="divider">
            <hr/><span>already a member?</span><hr/>
        </div>
        <a th:href="@{/login}" class="btn-secondary">Sign in</a>
    </div>
</main>

<footer>© 2025 Patrick Star Gym</footer>
</body>
</html>
